<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Dome</title>
<meta name="description" content="Dino Dome: pick a prehistoric fighter and battle in the stadium. 1 or 2 players.">
<meta name="theme-color" content="#5BC0FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dino Dome">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/lilita-one-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{
  --sky-top:#5BC0FF; --sky-bot:#C8EEFF; --sun:#FFD23F; --lava:#FF6B35;
  --grass:#4CB944; --grass-dark:#43A83D; --ink:#2B1B3D; --stand:#8E5CC2; --stand2:#74459F;
  --panel:#FFF8DC; --text:#2B1B3D; --page:#5BC0FF; --snack:#7FD3FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky-top:#171A45; --sky-bot:#3D3A8C; --grass:#2F9A3E; --grass-dark:#2A8938;
    --stand:#4B2F78; --stand2:#3A2360; --panel:#2E2552; --text:#FFF8DC; --page:#171A45;
  }
}
:root[data-theme="dark"]{
  --sky-top:#171A45; --sky-bot:#3D3A8C; --grass:#2F9A3E; --grass-dark:#2A8938;
  --stand:#4B2F78; --stand2:#3A2360; --panel:#2E2552; --text:#FFF8DC; --page:#171A45;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
body{
  height:100%;margin:0;overflow:hidden;color:var(--text);
  background:linear-gradient(var(--sky-top),var(--sky-bot));
  font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;font-weight:800;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.display{font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-weight:400;letter-spacing:.01em}
.outlined{color:#fff;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 7px 0 var(--ink)}
.outlined-sm{color:#fff;text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}

#app{position:relative;height:100%;max-width:1000px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

.btn{
  font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:22px;color:var(--ink);
  background:var(--sun);border:4px solid var(--ink);border-radius:18px;padding:12px 26px;
  box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn-alt{background:#fff}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:4px dashed #fff;outline-offset:3px}
.icon-btn{
  width:44px;height:44px;flex:0 0 44px;font-size:20px;border:4px solid var(--ink);border-radius:50%;
  background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn:disabled{opacity:.45}
.corner{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
.music-btn{position:relative}
.music-btn.off{opacity:.55}
.music-btn.off::after{content:"";position:absolute;left:14%;top:calc(50% - 2px);width:72%;height:4px;background:var(--lava);border-radius:2px;transform:rotate(-45deg)}
.announce-row .icon-btn{width:40px;height:40px;flex-basis:40px;font-size:18px}

/* Title */
#title{align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.title-ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--grass);border-top:5px solid var(--ink)}
.title-dinos{position:relative;display:flex;justify-content:space-between;width:min(92%,560px);z-index:1}
.title-dinos .dino-wrap{width:48%}
.title-dinos .flip svg{transform:scaleX(-1)}
#title h1{margin:4px 0 0;font-size:clamp(60px,15vw,124px);line-height:.95;position:relative;z-index:1}
#title h1 span{color:var(--sun)}
#title p{margin:6px 0 14px;max-width:30ch;font-size:clamp(17px,4.4vw,21px);line-height:1.35;position:relative;z-index:1}
#title .btn{font-size:25px;padding:13px 26px}
.title-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.controls{border-top:6px solid transparent;transition:border-color .3s}
.controls.turn-p1{border-top-color:var(--lava)}
.controls.turn-p2{border-top-color:#3E8EDE}

/* Pick */
.pick-head{padding:18px 64px 4px;text-align:center}
.pick-head h2{margin:0;font-size:clamp(30px,7.5vw,46px);line-height:1.05}
.pick-head p{margin:8px 0 0;font-size:17px}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 14px 16px;align-content:start}
@media (min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.group{grid-column:1 / -1;margin:8px 2px 0}
.group h3{margin:0;font-size:26px;line-height:1.1}
.group p{margin:2px 0 0;font-size:15px}
.card{
  position:relative;font:inherit;color:var(--text);background:var(--panel);border:4px solid var(--ink);
  border-radius:22px;padding:8px 8px 12px;box-shadow:0 6px 0 var(--ink);cursor:pointer;text-align:center;
  transition:transform .15s,background .15s;
}
.card:active:not(:disabled){transform:translateY(3px)}
.card.selected{background:var(--sun);color:var(--ink);transform:rotate(-2deg) scale(1.03)}
.card.taken{opacity:.45;cursor:default}
.card-art{aspect-ratio:220/170}
.card-art svg{width:100%;height:100%;display:block;overflow:visible}
.card-name{font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:26px;line-height:1;margin-top:4px}
.card-kind{font-size:13px;opacity:.75;margin-top:2px}
.card-blurb{font-size:14px;font-weight:700;line-height:1.3;margin-top:6px}
.card-stats{font-size:13px;margin-top:6px;line-height:1.4}
.badge{position:absolute;top:8px;left:8px;background:var(--lava);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:1px 8px;font-size:13px}
.pick-foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:10px 14px 16px}

/* Battle */
.arena{position:relative;flex:1;min-height:0;overflow:hidden;border-bottom:5px solid var(--ink)}
.stadium{position:absolute;inset:0;width:100%;height:100%}
.fan{transform-box:fill-box;transform-origin:center bottom}
.stadium.cheer .fan{animation:fanjump .28s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes fanjump{to{transform:translateY(-9px)}}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:10px;z-index:3}
.hp-card{
  width:min(46%,300px);background:var(--panel);color:var(--text);border:4px solid var(--ink);border-radius:16px;
  padding:6px 10px 8px;box-shadow:0 4px 0 var(--ink);transition:transform .2s,background .2s;
}
.hp-card.turn{background:var(--sun);color:var(--ink);transform:scale(1.04)}
.hp-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.hp-name{font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:clamp(17px,4.4vw,22px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-who{font-size:12px;display:flex;gap:6px;align-items:center;min-height:18px}
.hp-who .who{opacity:.75}
.hp-status{font-size:15px;letter-spacing:1px}
.hp-num{font-size:14px;white-space:nowrap}
.hp-bar{margin-top:3px;height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.hp-fill{height:100%;width:100%;background:var(--grass);transition:width .5s ease,background .3s}

.fighter{position:absolute;bottom:4%;height:46%;width:44%;z-index:2}
.p1{left:3%}
.p2{right:3%}
.dino-wrap{width:100%;height:100%;animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
.dino-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.p2 .dino-wrap svg{transform:scaleX(-1)}
.p2 .dino-wrap{animation-delay:-.8s}
@keyframes bob{50%{transform:translateY(-3%) scaleY(1.02)}}
.wing{transform-box:fill-box;animation:flap .45s ease-in-out infinite alternate}
.w1{transform-origin:100% 100%}
.w2{transform-origin:0% 100%}
@keyframes flap{to{transform:scaleY(.55)}}
.p1.lunge{animation:lungeR .5s ease-in-out}
.p2.lunge{animation:lungeL .5s ease-in-out}
@keyframes lungeR{35%{transform:translateX(-8%)}55%{transform:translateX(62%)}100%{transform:none}}
@keyframes lungeL{35%{transform:translateX(8%)}55%{transform:translateX(-62%)}100%{transform:none}}
.fighter.hurt{animation:hurt .45s}
.fighter.hurt .dino-wrap{animation:flash .45s}
@keyframes hurt{20%{transform:translateX(-6%) rotate(-4deg)}40%{transform:translateX(6%) rotate(4deg)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}
@keyframes flash{30%{filter:brightness(2.4) saturate(.2)}}
.fighter.jump{animation:jump .6s cubic-bezier(.3,0,.3,1)}
@keyframes jump{40%{transform:translateY(-38%)}70%{transform:translateY(3%) scaleY(.9)}100%{transform:none}}
.dino-wrap.roaring{animation:roar .8s ease-in-out}
@keyframes roar{20%{transform:scale(1.12) rotate(-3deg)}40%{transform:scale(1.16) rotate(3deg)}60%{transform:scale(1.12) rotate(-2deg)}100%{transform:none}}
.dino-wrap.wobble{animation:wobble .9s ease-in-out}
@keyframes wobble{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.fighter.powered svg{filter:drop-shadow(0 0 8px var(--sun)) drop-shadow(0 0 3px #fff)}
.fighter.dodging .dino-wrap{opacity:.55;transform:translateY(-6%) rotate(-6deg);animation:none;transition:transform .3s,opacity .3s}
.fighter.shielded::after{
  content:"";position:absolute;inset:-8% -6% -2%;border-radius:50%;pointer-events:none;
  border:4px solid #9FE8FF;background:radial-gradient(rgba(159,232,255,.08),rgba(159,232,255,.35));
  box-shadow:0 0 18px #9FE8FF;animation:shieldPulse 1.2s ease-in-out infinite;
}
@keyframes shieldPulse{50%{transform:scale(1.04);opacity:.8}}
.arena.shake{animation:shake .4s}
.fighter.charging{animation:charge .9s linear}
.fighter.charging svg{filter:drop-shadow(0 0 8px #FF5A5F) drop-shadow(0 0 22px #FF5A5F)}
@keyframes charge{10%,30%,50%,70%,90%{transform:translateX(-2px)}20%,40%,60%,80%{transform:translateX(2px)}}
.megaflash{position:absolute;inset:0;z-index:6;pointer-events:none;background:#fff;animation:mflash .55s ease-out forwards}
@keyframes mflash{from{opacity:.9}to{opacity:0}}
.slash{
  position:absolute;z-index:5;pointer-events:none;width:clamp(130px,36vw,280px);height:12px;border-radius:8px;
  background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 14px 4px #FF5A5F;
  transform:translate(-50%,-50%) rotate(var(--r)) scaleX(0);animation:slash .55s ease-out forwards;
}
@keyframes slash{35%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1.05);opacity:0}}
.move.mega-ready{animation:megaGlow 1.1s ease-in-out infinite}
@keyframes megaGlow{50%{box-shadow:0 5px 0 var(--ink),0 0 16px 4px #FF5A5F}}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.fighter.ko .dino-wrap{animation:none;transform:rotate(-14deg) translateY(8%);transition:transform .5s;opacity:1}
.p2.ko .dino-wrap{transform:rotate(14deg) translateY(8%)}
.stars{position:absolute;top:-8%;left:50%;font-size:clamp(22px,6vw,36px);animation:orbit 1.1s linear infinite;z-index:3}
@keyframes orbit{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}
.pop{
  position:absolute;z-index:4;pointer-events:none;white-space:nowrap;
  font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:clamp(30px,8vw,58px);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 6px 0 var(--ink);
  animation:pop 1.05s ease-out forwards;
}
.pop.small{font-size:clamp(22px,5.5vw,36px)}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1}
  35%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  75%{opacity:1}
  100%{transform:translate(-50%,-150%) scale(1);opacity:0}
}
.powerup{
  position:absolute;left:50%;top:44%;z-index:5;width:clamp(58px,15vw,86px);aspect-ratio:1;padding:0;cursor:pointer;
  border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:clamp(30px,8vw,46px);
  background:radial-gradient(circle at 35% 30%,#fff,#FFF0A0 45%,var(--sun));
  box-shadow:0 0 0 6px rgba(255,255,255,.55),0 0 26px 6px rgba(255,230,120,.9),0 6px 0 var(--ink);
  transform:translate(-50%,-50%);animation:drop .7s cubic-bezier(.3,1.4,.5,1),float 1.4s ease-in-out .7s infinite;
}
.powerup:disabled{cursor:default}
.pu-tag{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:10px;padding:1px 8px;
}
@keyframes drop{from{transform:translate(-50%,-420%) rotate(-20deg)}to{transform:translate(-50%,-50%)}}
@keyframes float{50%{transform:translate(-50%,-62%) rotate(6deg)}}

.controls{background:var(--panel);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.announce-row{display:flex;align-items:center;gap:8px}
.announce{flex:1;margin:0;font-size:clamp(15px,4.2vw,21px);line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:760px){.moves{grid-template-columns:repeat(6,1fr)}}
.move{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px 7px;min-height:74px;
  text-align:center;cursor:pointer;font:inherit;color:var(--ink);border:4px solid var(--ink);border-radius:16px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s;
}
.move:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.move:disabled{opacity:.42;cursor:default;filter:saturate(.5)}
.move .ico{font-size:24px;line-height:1}
.move .lbl{display:block;font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:clamp(14px,3.9vw,18px);line-height:1.05}
.move .hint{display:block;font-size:11px;font-weight:700;line-height:1.15}
@media (max-height:680px){.move .hint{display:none}.move{min-height:58px}}
.m-a{background:var(--lava)}
.m-b{background:#FF8FB1}
.m-c{background:#6BD35F}
.m-roar{background:var(--sun)}
.m-snack{background:var(--snack)}
.m-dodge{background:#E4D5FF}

.overlay{position:absolute;inset:0;z-index:10;display:none;place-items:center;background:rgba(43,27,61,.55);padding:16px}
.overlay.show{display:grid}
.win-card{
  width:min(100%,420px);background:var(--panel);color:var(--text);border:5px solid var(--ink);border-radius:28px;
  padding:16px 18px 20px;text-align:center;box-shadow:0 8px 0 var(--ink);animation:popin .45s cubic-bezier(.2,1.6,.4,1);
}
@keyframes popin{from{transform:scale(.5);opacity:0}}
.win-art{width:70%;margin:0 auto;aspect-ratio:220/170}
.win-card h2{margin:6px 0 4px;font-size:clamp(32px,9vw,46px);line-height:1}
.win-card p{margin:0 0 16px;font-size:17px}
.win-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg)}}

@media (prefers-reduced-motion:reduce){
  .dino-wrap,.stadium.cheer .fan,.stars,.wing,.fighter.shielded::after{animation:none}
  .arena.shake,.fighter.charging,.move.mega-ready,.slash{animation:none}
  .powerup{animation:none}
  .confetti{display:none}
}
</style>
</head>
<body>
<div id="app">

  <section id="title" class="screen active" aria-label="Title">
    <div class="title-ground"></div>
    <div class="corner"><button class="icon-btn music-btn" aria-label="Music on" aria-pressed="true">🎵</button><button class="icon-btn mute-btn" aria-label="Sound on">🔊</button></div>
    <div class="title-dinos">
      <div class="dino-wrap" id="titleA"></div>
      <div class="dino-wrap flip" id="titleB" style="animation-delay:-.8s"></div>
    </div>
    <h1 class="display outlined">Dino <span>Dome</span></h1>
    <p class="outlined-sm">Pick a fighter. Stomp, roar and grab power-ups to win!</p>
    <div class="title-btns"><button class="btn" id="start1">1 Player</button><button class="btn btn-alt" id="start2">2 Players</button></div>
  </section>

  <section id="pick" class="screen" aria-label="Pick fighters">
    <div class="corner"><button class="icon-btn music-btn" aria-label="Music on" aria-pressed="true">🎵</button><button class="icon-btn mute-btn" aria-label="Sound on">🔊</button></div>
    <div class="pick-head">
      <h2 class="display outlined" id="pickTitle">Pick your fighter</h2>
      <p class="outlined-sm">Tap one to hear it roar.</p>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pick-foot">
      <button class="btn btn-alt" id="backBtn">Back</button>
      <button class="btn btn-alt" id="surpriseBtn" hidden>Surprise me</button>
      <button class="btn" id="goBtn" disabled>Pick a fighter</button>
    </div>
  </section>

  <section id="battle" class="screen" aria-label="Battle">
    <div class="arena" id="arena">
      <svg class="stadium" id="stadium" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--sky-top)"/>
            <stop offset="1" style="stop-color:var(--sky-bot)"/>
          </linearGradient>
        </defs>
        <rect width="800" height="500" fill="url(#skyG)"/>
        <circle cx="620" cy="58" r="30" style="fill:var(--sun)" stroke="#2B1B3D" stroke-width="4"/>
        <g stroke="#2B1B3D" stroke-width="4">
          <rect x="56" y="36" width="10" height="110" fill="#8A8AAE"/>
          <rect x="30" y="14" width="62" height="30" rx="8" fill="#FFF3B0"/>
          <rect x="734" y="36" width="10" height="110" fill="#8A8AAE"/>
          <rect x="708" y="14" width="62" height="30" rx="8" fill="#FFF3B0"/>
        </g>
        <g fill="#FFFBE0"><circle cx="46" cy="29" r="6"/><circle cx="61" cy="29" r="6"/><circle cx="76" cy="29" r="6"/><circle cx="724" cy="29" r="6"/><circle cx="739" cy="29" r="6"/><circle cx="754" cy="29" r="6"/></g>
        <rect x="0" y="140" width="800" height="190" style="fill:var(--stand)"/>
        <g style="fill:var(--stand2)"><rect y="186" width="800" height="5"/><rect y="221" width="800" height="5"/><rect y="256" width="800" height="5"/><rect y="291" width="800" height="5"/></g>
        <g id="crowd"></g>
        <g>
          <rect x="290" y="94" width="220" height="50" rx="12" style="fill:var(--sun)" stroke="#2B1B3D" stroke-width="5"/>
          <text x="400" y="130" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="32" fill="#2B1B3D">Dino Dome</text>
        </g>
        <rect x="-5" y="300" width="810" height="40" style="fill:var(--lava)" stroke="#2B1B3D" stroke-width="5"/>

/* ---------- Sound (all made live with Web Audio) ---------- */
const Snd = (() => {
  let ctx = null, out = null, nbuf = null, muted = false;
  function init(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      out = ctx.createGain(); out.gain.value = muted ? 0 : .9;
      out.connect(comp); comp.connect(ctx.destination);
      nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = nbuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    if(ctx.state === 'suspended') ctx.resume();
  }
  const ok = () => ctx && !muted;
  const osc = (type,f) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; return o; };
  const gain = (v=0) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const filt = (type,f,q=1) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
  const noise = () => { const s = ctx.createBufferSource(); s.buffer = nbuf; s.loop = true; return s; };
  function env(g,t,a,p,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
  function play(src,t,dur){ src.start(t); src.stop(t+dur+.05); }
  function chain(...nodes){ for(let i=0;i<nodes.length-1;i++) nodes[i].connect(nodes[i+1]); return nodes[nodes.length-1]; }
  function curve(k){ const n=1024, c=new Float32Array(n); for(let i=0;i<n;i++){ const x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); } return c; }

function voice(d){
  if(d.voice === 'trumpet') Snd.trumpet(d.pitch);
  else if(d.voice === 'screech') Snd.screech(d.pitch);
  else if(d.voice === 'snarl') Snd.snarl(d.pitch);
  else if(d.voice === 'croak') Snd.croak(d.pitch);
  else if(d.voice === 'gurgle'){ Snd.roar(d.pitch); setTimeout(Snd.gulp, 500); }
  else Snd.roar(d.pitch);

function playSfx(list){ list.forEach(n => Snd[n] && Snd[n]()); }

/* ---------- Pick ---------- */
let phase = 'you', youId = null, rivalId = null, sel = null, cards = {};
function openPick(p){
  phase = p; sel = p === 'you' ? youId : null;
  const grid = $('#grid'); grid.innerHTML = ''; cards = {};
  $('#pickTitle').textContent = G.mode === 2 ? (p === 'you' ? 'Player 1, pick your fighter' : 'Player 2, pick your fighter')
    : (p === 'you' ? 'Pick your fighter' : `Who will ${DINOS[youId].name} battle?`);
  const groups = [
    ['dino','Dinosaurs','The real deal.'],
    ['pal','Prehistoric pals','Not dinos, but still totally awesome.'],
    ['myth','Monster mashups','Made-up monsters. Not real, but super fierce!']
  ];
  groups.forEach(([g, title, sub]) => {
    const h = document.createElement('div'); h.className = 'group';
    h.innerHTML = `<h3 class="display outlined-sm">${title}</h3><p class="outlined-sm">${sub}</p>`;
    grid.appendChild(h);
    Object.values(DINOS).filter(d => d.group === g).forEach(d => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'card';
      const taken = p === 'rival' && d.id === youId;
      b.innerHTML = `<div class="card-art">${dinoSVG(d.id)}</div><div class="card-name">${d.name}</div><div class="card-kind">${d.kind}</div><div class="card-blurb">${d.blurb}</div><div class="card-stats">❤️ ${d.hp}<br>${d.moves[0].ico} ${d.moves[0].name}<br>${d.moves[1].ico} ${d.moves[1].name}</div>${taken ? `<span class="badge">${G.mode === 2 ? 'Player 1' : 'You'}</span>` : ''}`;
      if(taken){ b.disabled = true; b.classList.add('taken'); }
      b.addEventListener('click', () => { Snd.init(); select(d.id); });
      cards[d.id] = b; grid.appendChild(b);
    });
  });
  updatePick(); show('pick'); grid.scrollTop = 0;
}
function select(id){
  sel = id; voice(DINOS[id]);
  const art = cards[id].querySelector('.card-art');
  art.classList.add('dino-wrap'); anim(art, 'roaring', 800);
  updatePick();
}
function updatePick(){
  Object.entries(cards).forEach(([id,b]) => { b.classList.toggle('selected', id === sel); b.setAttribute('aria-pressed', id === sel); });
  const go = $('#goBtn');
  go.disabled = !sel;
  go.textContent = phase === 'you' ? (sel ? `Pick ${DINOS[sel].name}` : 'Pick a fighter') : (sel ? 'Fight!' : (G.mode === 2 ? 'Pick a fighter' : 'Pick a rival'));
  $('#surpriseBtn').hidden = phase !== 'rival';
}
$('#goBtn').addEventListener('click', () => {
  if(!sel) return; Snd.blip();
  if(phase === 'you'){ youId = sel; openPick('rival'); }
  else { rivalId = sel; startBattle(); }
});
$('#backBtn').addEventListener('click', () => { Snd.blip(); phase === 'you' ? show('title') : openPick('you'); });
$('#surpriseBtn').addEventListener('click', async () => {
  Snd.init();
  const options = Object.keys(DINOS).filter(k => k !== youId);
  for(let i=0;i<8;i++){ sel = pick(options); updatePick(); Snd.blip(); await sleep(110); }
  select(pick(options));
  await sleep(900); rivalId = sel; startBattle();
});

function makeFighter(id, el){

function hintFor(m){

  $('#overlay').classList.remove('show');

    f.el.classList.remove('ko','powered','shielded','dodging');

  });
  $('#n1').textContent = G.p.d.name; $('#n2').textContent = G.c.d.name;
  $('#hud1 .who').textContent = G.mode === 2 ? 'Player 1' : 'You';
  $('#hud2 .who').textContent = G.mode === 2 ? 'Player 2' : 'Rival';
  G.battleId = (G.battleId || 0) + 1; const bid = G.battleId;
  G.over = false; G.intro = false; G.round = 0; G.sinceDrop = 0;
  G.first = G.mode === 2 ? (G.lastLoser || (Math.random() < .5 ? 'p' : 'c')) : 'p';
  G.turn = G.first;
  setupMoves(cur());
  updateHud(); show('battle'); setTurn(G.turn);
  Snd.whistle(); setTimeout(() => cheer(1800), 700);
  if(G.mode === 1){
    announce(`${G.p.d.name} vs ${G.c.d.name}! Your turn. Pick a move.`);
    G.busy = false; refreshMoves(); return;
  }
  G.busy = true; G.intro = true; refreshMoves();
  const who = G.first === 'p' ? 'Player 1' : 'Player 2';
  (async () => {
    if(G.lastLoser){
      announce(`${G.p.d.name} vs ${G.c.d.name}! ${who} lost last time, so ${who} goes first.`);
    } else {
      announce(`${G.p.d.name} vs ${G.c.d.name}! Coin toss...`);
      await sleep(900); if(G.over || G.battleId !== bid) return;
      Snd.coin(); pop(null, '🪙', '#fff', -6);
      await sleep(700); if(G.over || G.battleId !== bid) return;
      announce(`${who} won the coin toss and goes first!`);
    }
    await sleep(1300); G.intro = false; if(G.over || G.battleId !== bid) return;
    beginHumanTurn();
  })();
}
function statusText(f){
  let s = '';
  if(f.shield) s += '🛡️'; if(f.powered) s += f.sure ? '🌟' : '💪';
  if(f.extra) s += '⚡'; if(f.dodging) s += '💨'; if(f.stunned) s += '💫';
  return s;
}
function updateHud(){
  [[G.p,'1'],[G.c,'2']].forEach(([f,n]) => {
    const pct = Math.max(0, f.hp / f.max * 100);
    const fill = $('#b'+n); fill.style.width = pct + '%';
    fill.style.background = pct > 50 ? 'var(--grass)' : pct > 25 ? 'var(--sun)' : 'var(--lava)';
    $('#h'+n).textContent = `❤️ ${f.hp}`;
    $('#s'+n).textContent = statusText(f);
  });
}
function setTurn(w){
  $('#hud1').classList.toggle('turn', w === 'p'); $('#hud2').classList.toggle('turn', w === 'c');
  const c = $('.controls');
  c.classList.toggle('turn-p1', G.mode === 2 && w === 'p'); c.classList.toggle('turn-p2', G.mode === 2 && w === 'c');
}
function announce(t){ $('#announce').textContent = t; }
function canUse(f, m){
  const i = { a:0, b:1, c:2 }[m];
  if(i !== undefined) return !(f.d.moves[i].type === 'mega' && f.megaUsed);
  if(m === 'roar') return !f.powered;
  if(m === 'snack') return f.snacks > 0 && f.hp < f.max;
  if(m === 'dodge') return !f.dodging;
  return true;
}
function refreshMoves(){
  const locked = G.busy || G.over;
  const f = cur();
  document.querySelectorAll('.move').forEach(b => { b.disabled = locked || !canUse(f, b.dataset.move); });
  $('#roarHint').textContent = f.powered ? 'Already powered up!' : 'Next hit is super';
  $('#snackHint').textContent = f.snacks > 0 ? `Heal up (${f.snacks} left)` : 'All out of snacks';
  $('#quitBtn').disabled = G.busy && !G.over && !G.intro;
  ['a','b','c'].forEach((k,i) => {
    const mv = f.d.moves[i], b = $(`.move[data-move="${k}"]`);
    const ready = mv.type === 'mega' && !f.megaUsed;
    b.classList.toggle('mega-ready', ready && !locked);
    if(mv.type === 'mega') b.querySelector('.hint').textContent = f.megaUsed ? 'Used up!' : 'Once per battle!';
  });
  if(G.puEl) G.puEl.disabled = locked;
  updateHud();
}
function pop(who, text, color='var(--sun)', dy=0, small=false, dx=0){
  const p = document.createElement('div');
  p.className = 'pop' + (small ? ' small' : '');
  p.textContent = text; p.style.color = color;
  p.style.left = ((who === null ? 50 : who === G.p ? 27 : 73) + dx) + '%'; p.style.top = (36 + dy) + '%';
  arena.appendChild(p); setTimeout(() => p.remove(), 1100);
}
function cheer(ms=1800){
  stadium.classList.add('cheer'); Snd.crowd(ms/1000 + .4);
  clearTimeout(cheerT); cheerT = setTimeout(() => stadium.classList.remove('cheer'), ms);
}
function unpower(f){ f.powered = false; f.sure = false; f.el.classList.remove('powered'); }
function endDodge(f){ f.dodging = false; f.el.classList.remove('dodging'); }
function applyHit(t, dmg, dx=0){
  if(t.shield){
    t.shield = false; t.el.classList.remove('shielded');
    Snd.shield(); pop(t, 'BLOCKED!', '#9FE8FF'); updateHud(); return 0;
  }
  anim(t.el, 'hurt', 450);
  t.hp = Math.max(0, t.hp - dmg);
  pop(t, '-' + dmg, '#fff', 18, true, dx);
  updateHud(); return dmg;
}
function stun(t){
  t.stunned = true;
  const s = document.createElement('div'); s.className = 'stars dizzy'; s.textContent = '💫🐤'; t.el.appendChild(s);
  Snd.tweet(); pop(t, 'DIZZY!', '#FFE680', -12);
}
async function skipDizzy(f){
  announce(`${f.d.name} is too dizzy to move!`);
  Snd.tweet(); anim(f.wrap, 'wobble', 900);
  await sleep(1300);
  f.stunned = false; f.justRecovered = true;
  f.el.querySelector('.stars.dizzy')?.remove(); updateHud();
}

function slashFx(t, i){
  const el = document.createElement('div'); el.className = 'slash';
  el.style.left = ((t === G.p ? 27 : 73) + (i - 1) * 4) + '%';
  el.style.top = (50 + (i - 1) * 9) + '%';
  el.style.setProperty('--r', (t === G.p ? 35 : -35) + 'deg');
  arena.appendChild(el); setTimeout(() => el.remove(), 600);
}
async function megaAttack(a, t, mv){
  a.megaUsed = true;
  announce(`${a.d.name} is charging up...`);
  Snd.charge(); a.el.classList.add('charging');
  await sleep(950); a.el.classList.remove('charging');
  const f = document.createElement('div'); f.className = 'megaflash'; arena.appendChild(f); setTimeout(() => f.remove(), 600);
  announce(`${mv.name.toUpperCase()}!`);
  anim(a.el, 'lunge', 500); Snd.whoosh(); await sleep(250);
  const sup = a.powered; if(sup) unpower(a);
  if(t.dodging) endDodge(t);
  const mult = (sup ? 1.5 : 1) * (a === G.c && G.mode === 1 ? .85 : 1);
  pop(t, mv.word, '#FF8A8E', -18);
  for(let i=0;i<mv.hits;i++){
    slashFx(t, i); playSfx(mv.sfx); anim(arena, 'shake', 300);
    applyHit(t, Math.round(rand(mv.min, mv.max) * mult), (i - 1) * 7);
    await sleep(340);
    if(t.hp <= 0) break;
  }
  Snd.stomp(); cheer(2200);
  announce(`${mv.name}! ${a.d.name} slashed ${mv.hits} times!`);
  updateHud(); await sleep(1000);
}
async function attack(a, t, mv){
  if(mv.type === 'mega') return megaAttack(a, t, mv);
  announce(`${a.d.name} used ${mv.name}!`);
  const sup = a.powered, sure = a.sure;
  if(mv.type === 'shake'){ anim(a.el, 'jump', 600); await sleep(400); }
  else { anim(a.el, 'lunge', 500); Snd.whoosh(); await sleep(260); }
  const wasDodging = t.dodging;
  let missed = false;
  if(!sure && mv.type !== 'shake') missed = wasDodging ? Math.random() < .7 : Math.random() < mv.miss;
  else if(!sure && wasDodging) missed = Math.random() < .5;
  if(sup) unpower(a);
  if(wasDodging) endDodge(t);
  if(missed){
    Snd.miss(); pop(t, wasDodging ? 'Dodged!' : 'Missed!', '#fff');
    announce(wasDodging ? `${t.d.name} dodged ${mv.name}! Whoosh!` : `${a.d.name} used ${mv.name}... and missed!`);
    updateHud(); await sleep(950); return;
  }
  const mult = (sup ? 1.8 : 1) * (a === G.c && G.mode === 1 ? .85 : 1);
  if(mv.type === 'multi'){
    const n = rand(mv.hits[0], mv.hits[1]);
    pop(t, (sup ? 'SUPER ' : '') + mv.word, 'var(--sun)', -14);
    for(let i=0;i<n;i++){
      playSfx(mv.sfx);
      applyHit(t, Math.round(rand(mv.min, mv.max) * mult), rand(-8, 8));
      await sleep(280);
      if(t.hp <= 0) break;
    }
    announce(`${a.d.name} used ${mv.name}! It hit ${n} times!`);
    if(sup || n >= 4) cheer();
  } else {
    playSfx(mv.sfx);
    if(mv.type === 'shake') anim(arena, 'shake', 400);
    const dealt = applyHit(t, Math.round(rand(mv.min, mv.max) * mult));
    if(dealt > 0){
      pop(t, (sup ? 'SUPER ' : '') + mv.word);
      if(mv.type === 'dizzy' && t.hp > 0 && !t.justRecovered && !t.stunned && Math.random() < (sup ? 1 : mv.stun)){
        await sleep(350); stun(t); announce(`${a.d.name} used ${mv.name}! ${t.d.name} is dizzy!`);
      }
      if(mv.type === 'drain'){
        const h = Math.min(Math.round(dealt / 2), a.max - a.hp);
        if(h > 0){ a.hp += h; await sleep(300); Snd.heal(); pop(a, '+' + h, '#9BFF8A', 10, true); }
      }
      if(sup || dealt >= 26){ anim(arena, 'shake', 400); cheer(); }
    }
  }
  updateHud(); await sleep(950);
}

async function act(a, t, key){
  if(a.dodging) endDodge(a);
  const idx = { a:0, b:1, c:2 }[key];
  if(idx !== undefined){
    await attack(a, t, a.d.moves[idx]);
  } else if(key === 'roar'){
    announce(`${a.d.name} used ${a.d.shout}! The next hit will be super strong.`);
    anim(a.wrap, 'roaring', 800); voice(a.d); pop(a, a.d.shout.toUpperCase() + '!');
    await sleep(550); Snd.power(); a.powered = true; a.el.classList.add('powered'); updateHud();
    await sleep(750);
  } else if(key === 'snack'){
    a.snacks--; Snd.crunch(); await sleep(250);
    const h = Math.min(22, a.max - a.hp); a.hp += h;
    Snd.heal(); pop(a, '🌿 +' + h, '#9BFF8A');
    announce(`${a.d.name} ate a leafy snack. Yum!`);
    updateHud(); await sleep(950);
  } else if(key === 'dodge'){
    a.dodging = true; a.el.classList.add('dodging');
    Snd.dodge(); pop(a, '💨', '#fff');
    announce(`${a.d.name} gets ready to dodge!`);
    updateHud(); await sleep(850);
  }
  a.justRecovered = false;
  updateHud();
}

/* Power-ups */
function spawnPowerup(){
  const pu = pick(POWERUPS);
  G.pu = pu; G.sinceDrop = 0;
  const b = document.createElement('button');
  b.className = 'powerup';
  b.innerHTML = `<span aria-hidden="true">${pu.ico}</span><span class="pu-tag">${pu.name}</span>`;
  b.setAttribute('aria-label', `Grab the ${pu.name} power-up`);
  b.addEventListener('click', playerGrab);
  arena.appendChild(b); G.puEl = b;
  Snd.drop();
}
async function maybeDrop(next){
  G.sinceDrop++;
  if(G.pu) return;
  const other = next === G.p ? G.c : G.p;
  const behind = next.hp / next.max < other.hp / other.max - .1;
  if(Math.random() < (behind ? .4 : .18) || G.sinceDrop >= 5){
    spawnPowerup(); announce('A power-up dropped in!'); await sleep(1000);
  }
}
async function grab(f){
  const pu = G.pu; clearPowerup();
  const o = f === G.p ? G.c : G.p;
  Snd.coin(); pop(f, pu.ico, '#fff', -8);
  await sleep(250);
  if(pu.id === 'shield'){
    f.shield = true; f.el.classList.add('shielded'); Snd.shield();
    announce(`${f.d.name} grabbed a Shield! The next hit gets blocked.`);
  } else if(pu.id === 'zoom'){
    f.extra = true; Snd.zap();
    announce(`${f.d.name} drank Zoom Juice! Two moves in a row!`);
  } else if(pu.id === 'melon'){
    const h = Math.min(35, f.max - f.hp); f.hp += h;
    Snd.crunch(); setTimeout(Snd.heal, 200); pop(f, '🍉 +' + h, '#9BFF8A', 14, true);
    announce(`${f.d.name} munched a Mega Melon! Big heal!`);
  } else if(pu.id === 'pepper'){
    announce(`${f.d.name} ate a Hot Pepper... FIRE BREATH!`);
    anim(f.wrap, 'roaring', 800); await sleep(350);
    Snd.fire(); pop(o, '🔥 FIRE!', '#FFB347', -12);
    applyHit(o, Math.round(rand(14, 20) * (f === G.c && G.mode === 1 ? .85 : 1)));
    cheer(1400);
  } else if(pu.id === 'star'){
    f.powered = true; f.sure = true; f.el.classList.add('powered');
    Snd.sparkle(); Snd.power();
    announce(`Super Star! ${f.d.name}'s next attack is super and can't miss!`);
  }
  updateHud(); await sleep(1000);
}
async function playerGrab(){
  if(G.busy || G.over || !G.pu) return;
  Snd.init(); G.busy = true; refreshMoves();
  await grab(cur());
  if(await checkKO()) return;
  G.busy = false; refreshMoves();
  announce('Nice grab! Now pick a move.');
}

/* Turn flow */
function cpuPick(){
  for(let i=0;i<6;i++){ const k = cpuPickRaw(); if(canUse(G.c, k)) return k; }
  return 'b';
}
function cpuPickRaw(){
  const c = G.c;
  if(c.hp < c.max * .35 && canUse(c,'snack') && Math.random() < .55) return 'snack';
  if(c.powered) return pick(['a','a','b','c']);
  const r = Math.random();
  if(r < .15 && canUse(c,'roar')) return 'roar';
  if(r < .24 && canUse(c,'dodge')) return 'dodge';
  return pick(['a','a','b','b','c']);
}
async function checkKO(){
  if(G.c.hp <= 0){ await win(G.p, G.c); return true; }
  if(G.p.hp <= 0){ await win(G.c, G.p); return true; }
  return false;
}
async function playerMove(m){
  const a = cur(), t = opp();
  if(G.busy || G.over || !canUse(a, m)) return;
  Snd.blip(); G.busy = true; refreshMoves();
  await act(a, t, m);
  if(await checkKO()) return;
  if(a.extra){
    a.extra = false; Snd.zap(); updateHud();
    announce(`Zoom Juice! ${a.d.name} goes again!`);
    G.busy = false; refreshMoves(); return;
  }
  if(G.mode === 2) await humanTurnEnd(); else { await maybeDrop(G.c); await cpuPhase(); }
}
/* Two player: pass the device back and forth */
async function humanTurnEnd(){
  G.turn = G.turn === 'p' ? 'c' : 'p';
  if(G.turn === G.first) G.round++;
  await maybeDrop(cur());
  await beginHumanTurn();
}
async function beginHumanTurn(){
  const f = cur();
  setTurn(G.turn); setupMoves(f);
  pop(null, `${label(f)}'s turn!`, G.turn === 'p' ? '#FFB38A' : '#9FD0FF', -6);
  Snd.blip(); await sleep(500);
  if(f.stunned){ await skipDizzy(f); return humanTurnEnd(); }
  announce(`${label(f)}, pick a move for ${f.d.name}!` + (G.pu ? ' Or tap the power-up to grab it.' : ''));
  G.busy = false; refreshMoves();
}
async function cpuPhase(){
  G.turn = 'c'; setTurn('c');
  while(true){
    await sleep(600);
    if(G.pu && Math.random() < .55){
      await grab(G.c);
      if(await checkKO()) return;
    }
    if(G.c.stunned){
      await skipDizzy(G.c);
    } else {
      announce(`${G.c.d.name} is thinking...`); await sleep(600);
      await act(G.c, G.p, cpuPick());
      if(await checkKO()) return;
    }
    if(G.c.extra){
      G.c.extra = false; Snd.zap(); updateHud();
      announce(`Zoom Juice! ${G.c.d.name} goes again!`); await sleep(900);
      continue;
    }
    break;
  }
  G.round++;
  await maybeDrop(G.p);
  G.turn = 'p'; setTurn('p');
  if(G.p.stunned){ await skipDizzy(G.p); return cpuPhase(); }
  announce(G.pu ? 'Your turn! Tap the power-up to grab it, then pick a move.' : 'Your turn! Pick a move.');
  G.busy = false; refreshMoves();
}
async function win(w, l){
  G.over = true; G.lastLoser = l === G.p ? 'p' : 'c'; clearPowerup(); refreshMoves(); setTurn('');
  l.el.querySelectorAll('.stars').forEach(s => s.remove());
  endDodge(l); l.el.classList.remove('shielded');
  l.el.classList.add('ko');
  const st = document.createElement('div'); st.className = 'stars'; st.textContent = '💫⭐'; l.el.appendChild(st);
  announce(`${l.d.name} is dizzy! ${w.d.name} wins!`);
  Snd.duck(.25, 3600); cheer(3200); await sleep(700);
  Snd.fanfare(); anim(w.wrap, 'roaring', 800); await sleep(1300);
  voice(w.d); confetti(); await sleep(700);
  const youWon = w === G.p;
  $('#winArt').innerHTML = dinoSVG(w.d.id);
  if(G.mode === 2){
    $('#winTitle').textContent = `${label(w)} wins!`;
    $('#winSub').textContent = `${w.d.name} is the Dino Dome champ! ${label(l)}, want a rematch?`;
  } else {
    $('#winTitle').textContent = youWon ? `${w.d.name} wins!` : `${w.d.name} wins this time!`;
    $('#winSub').textContent = youWon ? 'You are the Dino Dome champ!' : `${l.d.name} wants a rematch.`;
  }
  $('#overlay').classList.add('show');
  $('#rematchBtn').focus();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#FFD23F','#FF6B35','#6BD35F','#7FD3FF','#FF8FB1','#9B6BDF'];
  for(let i=0;i<70;i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.8 + Math.random()*1.6) + 's'; c.style.animationDelay = (Math.random()*.6) + 's';
    c.style.borderRadius = Math.random() < .4 ? '50%' : '2px';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4300);
  }
}

document.querySelectorAll('.move').forEach(b => b.addEventListener('click', () => { Snd.init(); Snd.startMusic(); playerMove(b.dataset.move); }));
$('#rematchBtn').addEventListener('click', () => { Snd.blip(); startBattle(); });
$('#newBtn').addEventListener('click', () => { Snd.blip(); G.lastLoser = null; $('#overlay').classList.remove('show'); openPick('you'); });
$('#quitBtn').addEventListener('click', () => {
  if(G.busy && !G.over && !G.intro) return;
  Snd.blip(); G.over = true; clearPowerup(); $('#overlay').classList.remove('show'); openPick('you');
});
document.addEventListener('keydown', e => {
  if(!$('#battle').classList.contains('active')) return;
  const m = { '1':'a', '2':'b', '3':'c', '4':'roar', '5':'snack', '6':'dodge' }[e.key];
  if(m){ Snd.init(); playerMove(m); }
  if(e.key === 'g' || e.key === 'G') playerGrab();
});

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
